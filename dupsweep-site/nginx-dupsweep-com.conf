# HTTPS — official host
server {
    listen 443 ssl;
    server_name www.dupsweep.com;

    ssl_certificate /etc/letsencrypt/live/dupsweep.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dupsweep.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/dupsweep-com;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# HTTPS — apex → www
server {
    listen 443 ssl;
    server_name dupsweep.com;

    ssl_certificate /etc/letsencrypt/live/dupsweep.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dupsweep.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.dupsweep.com$request_uri;
}

# HTTP — both names → official HTTPS www
server {
    listen 80;
    listen [::]:80;
    server_name dupsweep.com www.dupsweep.com;
    return 301 https://www.dupsweep.com$request_uri;
}
